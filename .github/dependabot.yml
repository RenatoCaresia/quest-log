# O Dependabot abre PRs semanais para atualizar dependências.
# Cada PR passa pelo CI antes do merge, como qualquer outra mudança.
# Pacotes que precisam da mesma versão andam juntos, num PR só.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    # Majors que exigem trabalho próprio antes de entrar:
    # - ESLint 10: depende de o eslint-config-next suportar a nova versão.
    # - TypeScript 7: no Next.js exige a opção experimental.useTypeScriptCli.
    # Quando chegar a hora, remova a linha e trate a atualização numa issue.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
